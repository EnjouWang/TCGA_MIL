# subtype_LUAD_vs_LUSC_patch.yaml
# Task: Binary classification  LUAD(0) vs LUSC(1)  using patch-level embeddings

experiment_name: subtype_LUAD_vs_LUSC_patch
task_type: patch   # signals run_experiment.sh to use train.py / test.py

# Relative paths resolve against the repo root.
csv_dir: data/4_fold/subtype_LUAD_vs_LUSC_patch
# Machine-specific: root of the feature .pt files (CSV paths are relative to it).
# Leave null and pass --feature_root to run_experiment.sh, or fill it in here.
feature_root: null

# Feature dimension of the foundation model (CHIEF / CHIEF_WSI = 768)
in_dim: 768

save_base_dir: experiments

# Training hyperparameters
num_epochs: 100
lr: 0.0001
patience: 15
seed: 42

# WandB
wandb_project: subtype_LUAD_vs_LUSC_abMIL_patch
