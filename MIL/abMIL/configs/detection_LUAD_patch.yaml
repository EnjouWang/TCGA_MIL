# Experiment: Tumor detection (LUAD)
experiment_name: detection_LUAD_patch
task: detection
task_type: patch
cancer_type: LUAD

# Relative paths resolve against the repo root.
csv_dir: data/4_fold/detection_LUAD_patch
# Machine-specific: root of the feature .pt files (CSV paths are relative to it).
# Leave null and pass --feature_root to run_experiment.sh, or fill it in here.
feature_root: null

# Feature dimension of the foundation model (CHIEF / CHIEF_WSI = 768)
in_dim: 768

# Output
save_base_dir: experiments

# WandB
wandb_project: detection_LUAD_abMIL_patch

# Training hyperparameters
lr: 0.00001
patience: 3
num_epochs: 20
seed: 42
